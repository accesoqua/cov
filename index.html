<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Frecuente</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#3B82F6">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-100 p-4 font-sans antialiased">
    
    <div class="max-w-md mx-auto bg-white rounded-2xl shadow-lg overflow-hidden md:max-w-xl mb-6">
        <div class="bg-blue-600 p-5 text-white text-center">
            <h1 class="text-2xl font-bold">Agenda de Seguimiento</h1>
            <p class="text-blue-200 text-sm mt-1">Gestión de contactos</p>
        </div>

        <div class="p-6">
            <form id="trackerForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-gray-700">Nombre del contacto</label>
                    <input type="text" id="name" required placeholder="Ej: María" class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:border-blue-500 focus:ring-blue-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700">Fecha del último registro</label>
                    <input type="date" id="lastRecord" required class="mt-1 block w-full rounded-lg border-gray-300 shadow-sm p-3 border focus:border-blue-500 focus:ring-blue-500 outline-none transition">
                </div>

                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <label class="block text-sm font-semibold text-gray-700 mb-2">¿Cómo calcular el intervalo?</label>
                    <div class="flex space-x-4">
                        <label class="flex items-center">
                            <input type="radio" name="calcMethod" value="manual" checked class="text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">Ingresar días</span>
                        </label>
                        <label class="flex items-center">
                            <input type="radio" name="calcMethod" value="dates" class="text-blue-600 focus:ring-blue-500">
                            <span class="ml-2 text-sm text-gray-700">Usar 2 fechas</span>
                        </label>
                    </div>

                    <div id="manualInput" class="mt-4">
                        <label class="block text-sm font-medium text-gray-600">Intervalo de días</label>
                        <input type="number" id="intervalDays" value="28" min="20" max="45" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border outline-none">
                    </div>

                    <div id="datesInput" class="mt-4 hidden">
                        <label class="block text-sm font-medium text-gray-600">Fecha del registro ANTERIOR</label>
                        <input type="date" id="prevRecord" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border outline-none">
                        <p class="text-xs text-gray-500 mt-2">Se calcularán los días de diferencia automáticamente.</p>
                    </div>
                </div>

                <button type="submit" class="w-full bg-blue-600 text-white p-3 rounded-xl hover:bg-blue-700 font-bold shadow-md transition transform hover:-translate-y-0.5">
                    Guardar Nuevo Contacto
                </button>
            </form>
        </div>
    </div>

    <!-- Lista de perfiles -->
    <div class="max-w-md mx-auto pb-10">
        <h2 class="text-xl font-bold mb-4 text-gray-800 px-2">Registros Activos</h2>
        
        <div id="recordsList" class="space-y-4 mb-6"></div>

        <!-- Zona de Importar/Exportar -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
            <h3 class="text-sm font-bold text-gray-700 mb-3 text-center">Respaldo de Datos</h3>
            <div class="flex space-x-3">
                <button onclick="exportData()" type="button" class="flex-1 bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 text-sm font-semibold transition border border-gray-300">
                    📤 Exportar
                </button>
                <button onclick="document.getElementById('importFile').click()" type="button" class="flex-1 bg-gray-100 text-gray-700 p-2 rounded-lg hover:bg-gray-200 text-sm font-semibold transition border border-gray-300">
                    📥 Importar
                </button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importData(event)">
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('trackerForm');
        const manualInput = document.getElementById('manualInput');
        const datesInput = document.getElementById('datesInput');
        const radioMethods = document.getElementsByName('calcMethod');
        const recordsList = document.getElementById('recordsList');
        
        let records = JSON.parse(localStorage.getItem('trackerDataV2')) || [];

        radioMethods.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'manual') {
                    manualInput.classList.remove('hidden');
                    datesInput.classList.add('hidden');
                    document.getElementById('intervalDays').required = true;
                    document.getElementById('prevRecord').required = false;
                } else {
                    manualInput.classList.add('hidden');
                    datesInput.classList.remove('hidden');
                    document.getElementById('intervalDays').required = false;
                    document.getElementById('prevRecord').required = true;
                }
            });
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const lastRecordStr = document.getElementById('lastRecord').value;
            const method = document.querySelector('input[name="calcMethod"]:checked').value;
            
            const lastRecordDate = new Date(lastRecordStr + 'T12:00:00'); 
            let intervalDays = 28;
            
            if (method === 'manual') {
                intervalDays = parseInt(document.getElementById('intervalDays').value);
            } else {
                const prevRecordStr = document.getElementById('prevRecord').value;
                if (!prevRecordStr) {
                    alert("Por favor ingresa la fecha del registro anterior.");
                    return;
                }
                const prevRecordDate = new Date(prevRecordStr + 'T12:00:00');
                
                if (lastRecordDate <= prevRecordDate) {
                    alert("La última fecha debe ser posterior a la anterior.");
                    return;
                }

                const diffTime = Math.abs(lastRecordDate - prevRecordDate);
                intervalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            }

            // Ahora solo guardamos los datos base. El cálculo se hace al renderizar.
            const record = {
                id: Date.now(),
                name,
                intervalDays,
                lastDate: lastRecordStr
            };

            records.unshift(record);
            localStorage.setItem('trackerDataV2', JSON.stringify(records));
            
            renderRecords();
            form.reset();
            document.querySelector('input[value="manual"]').click();
        });

        function deleteRecord(id) {
            if(confirm("¿Borrar este contacto?")) {
                records = records.filter(r => r.id !== id);
                localStorage.setItem('trackerDataV2', JSON.stringify(records));
                renderRecords();
            }
        }

        // Mostrar / Ocultar el cuadro para modificar fecha
        function toggleEdit(id) {
            const editBox = document.getElementById(`edit-box-${id}`);
            editBox.classList.toggle('hidden');
        }

        // Guardar la nueva fecha manual
        function saveNewDate(id) {
            const newDateInput = document.getElementById(`edit-input-${id}`).value;
            if (!newDateInput) return;

            const index = records.findIndex(r => r.id === id);
            if (index !== -1) {
                records[index].lastDate = newDateInput;
                localStorage.setItem('trackerDataV2', JSON.stringify(records));
                renderRecords(); // Vuelve a calcular todo
            }
        }

        // Generar alarma
        function createAlarm(name, dateISO) {
            const dateParts = dateISO.split('-');
            const dtstart = `${dateParts[0]}${dateParts[1]}${dateParts[2]}T120000`;
            const dtend = `${dateParts[0]}${dateParts[1]}${dateParts[2]}T121500`;
            
            const icsContent = `BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Agenda Frecuente//ES\nBEGIN:VEVENT\nSUMMARY:Escribir a ${name}\nDTSTART:${dtstart}\nDTEND:${dtend}\nDESCRIPTION:Recordatorio programado.\nBEGIN:VALARM\nTRIGGER:-PT0M\nACTION:DISPLAY\nDESCRIPTION:Recordatorio\nEND:VALARM\nEND:VEVENT\nEND:VCALENDAR`;

            const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `alarma_${name.replace(/\s+/g, '_')}.ics`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            
            alert(`Se descargó la alarma para "${name}".\nToca "Abrir" para guardarla en tu calendario.`);
        }

        // Exportar e Importar
        function exportData() {
            if (records.length === 0) return;
            const dataStr = JSON.stringify(records);
            const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(dataStr);
            const linkElement = document.createElement('a');
            linkElement.setAttribute('href', dataUri);
            linkElement.setAttribute('download', 'mis_contactos.json');
            document.body.appendChild(linkElement);
            linkElement.click();
            document.body.removeChild(linkElement);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedRecords = JSON.parse(e.target.result);
                    if (Array.isArray(importedRecords)) {
                        const existingIds = new Set(records.map(r => r.id));
                        const newRecords = importedRecords.filter(r => !existingIds.has(r.id));
                        records = [...newRecords, ...records];
                        localStorage.setItem('trackerDataV2', JSON.stringify(records));
                        renderRecords();
                    }
                } catch (error) {}
                event.target.value = '';
            };
            reader.readAsText(file);
        }

        // FUNCIÓN PRINCIPAL: Dibuja las tarjetas y actualiza fechas automáticamente
        function renderRecords() {
            recordsList.innerHTML = '';
            if (records.length === 0) {
                recordsList.innerHTML = '<p class="text-gray-500 text-center py-6 bg-white rounded-xl shadow-sm">No hay contactos guardados.</p>';
                return;
            }

            const now = new Date();
            let dataWasUpdated = false;
            
            records.forEach(r => {
                // Configurar la fecha inicial
                let baseDate = new Date(r.lastDate + 'T12:00:00');
                
                // LÓGICA DE ACTUALIZACIÓN AUTOMÁTICA
                // Calcula el día clave. Si ya pasó, avanza al siguiente mes automáticamente.
                let nextPeriod = new Date(baseDate);
                nextPeriod.setDate(nextPeriod.getDate() + r.intervalDays);
                
                let keyDate = new Date(nextPeriod);
                keyDate.setDate(keyDate.getDate() - 14);

                let endOfWindow = new Date(keyDate);
                endOfWindow.setDate(endOfWindow.getDate() + 1); // 1 día después del día clave

                // Mientras el periodo ya haya pasado, avanza el ciclo
                while (now > endOfWindow) {
                    baseDate.setDate(baseDate.getDate() + r.intervalDays);
                    
                    nextPeriod = new Date(baseDate);
                    nextPeriod.setDate(nextPeriod.getDate() + r.intervalDays);
                    
                    keyDate = new Date(nextPeriod);
                    keyDate.setDate(keyDate.getDate() - 14);
                    
                    endOfWindow = new Date(keyDate);
                    endOfWindow.setDate(endOfWindow.getDate() + 1);
                    dataWasUpdated = true;
                }

                if (dataWasUpdated) {
                    // Guarda la nueva fecha base para el futuro
                    r.lastDate = baseDate.toISOString().split('T')[0];
                }

                // Generar los textos finales para mostrar en pantalla
                let windowStartDate = new Date(keyDate);
                windowStartDate.setDate(windowStartDate.getDate() - 4);
                
                let notificationDate = new Date(windowStartDate);
                notificationDate.setDate(notificationDate.getDate() + 1);
                
                const dateOptions = { day: 'numeric', month: 'long' };
                const keyDateStr = keyDate.toLocaleDateString('es-ES', dateOptions);
                const windowStr = `${windowStartDate.toLocaleDateString('es-ES', dateOptions)} al ${keyDateStr}`;
                const notifIsoStr = `${notificationDate.getFullYear()}-${String(notificationDate.getMonth()+1).padStart(2, '0')}-${String(notificationDate.getDate()).padStart(2, '0')}`;

                // Dibujar la tarjeta
                const div = document.createElement('div');
                div.className = 'bg-white p-5 rounded-xl shadow-sm border border-gray-100 relative';
                div.innerHTML = `
                    <button onclick="deleteRecord(${r.id})" class="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" /></svg>
                    </button>
                    
                    <h3 class="font-bold text-xl text-blue-700 capitalize pr-8">${r.name}</h3>
                    <p class="text-sm text-gray-500 mb-4">Intervalo: ${r.intervalDays} días</p>
                    
                    <div class="bg-blue-50 rounded-lg p-3 border border-blue-100 mb-3">
                        <p class="text-sm text-blue-900 mb-1"><strong>Día clave:</strong> ${keyDateStr}</p>
                        <p class="text-sm text-blue-900"><strong>Periodo de interés:</strong><br> ${windowStr}</p>
                    </div>

                    <!-- Botones de acción -->
                    <div class="flex flex-col space-y-2 mb-2">
                        <button onclick="createAlarm('${r.name}', '${notifIsoStr}')" class="w-full bg-gray-800 text-white p-2 rounded-lg text-sm font-semibold hover:bg-gray-900 transition flex justify-center items-center">
                            <span class="mr-2">🔔</span> Activar recordatorio (12:00 PM)
                        </button>
                        
                        <button onclick="toggleEdit(${r.id})" class="w-full bg-gray-100 text-gray-600 p-2 rounded-lg text-sm font-semibold hover:bg-gray-200 transition">
                            ✏️ Modificar registro base
                        </button>
                    </div>

                    <!-- Caja oculta para editar la fecha manualmente -->
                    <div id="edit-box-${r.id}" class="hidden mt-2 p-3 bg-gray-50 border rounded-lg">
                        <label class="block text-xs font-semibold text-gray-600 mb-1">Nueva fecha del registro:</label>
                        <div class="flex space-x-2">
                            <input type="date" id="edit-input-${r.id}" value="${r.lastDate}" class="flex-1 text-sm border border-gray-300 rounded-md p-2 outline-none focus:border-blue-500">
                            <button onclick="saveNewDate(${r.id})" class="bg-blue-600 text-white px-4 py-2 rounded-md text-sm font-bold shadow-sm">OK</button>
                        </div>
                    </div>
                `;
                recordsList.appendChild(div);
            });

            // Si se actualizó algo automáticamente en el fondo, lo guardamos
            if (dataWasUpdated) {
                localStorage.setItem('trackerDataV2', JSON.stringify(records));
            }
        }

        renderRecords();
    </script>
</body>
</html>
